name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: LuciferDono
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=D97757&color_dots=F5F4EE,EBDBC7,D9B58E,CC785C,A04E2A
            dist/github-snake-dark.svg?palette=github-dark&color_snake=D97757&color_dots=1A1A1A,3D3633,67524C,A07467,D97757

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
